kind = "web"
previewPath = "/"
title = "Komorebi"
description = "A faithful responsive website recreation of Frame 3 from the user's Komorebi Figma design, focused on visual accuracy, typography, imagery, and polished interactions."
version = "1.0.0"
id = "artifacts/komorebi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21746

[services.development]
run = "pnpm --filter @workspace/komorebi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/komorebi", "run", "build" ]
serve = "static"
publicDir = "artifacts/komorebi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21746"
BASE_PATH = "/"
